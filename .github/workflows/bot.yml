name: Free Game Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      claim_dry_run:
        description: "僅檢查 Steam 頁面，不執行領取"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: free-game-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Restore Steam login state
        run: |
          if [ -z "$STEAM_STORAGE_STATE_B64" ]; then
            echo "STEAM_STORAGE_STATE_B64 not configured, skip Steam login state"
            exit 0
          fi
          mkdir -p auth
          echo "$STEAM_STORAGE_STATE_B64" | base64 --decode > auth/steam.json
        env:
          STEAM_STORAGE_STATE_B64: ${{ secrets.STEAM_STORAGE_STATE_B64 }}
      - run: npm start
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_CLAIM: "false"
          CLAIM_DRY_RUN: ${{ inputs.claim_dry_run || false }}
      - name: Commit processed state
        run: |
          if git diff --quiet -- data/processed.json; then
            echo "No processed state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed.json
          git commit -m "chore: update processed state"
          git push
