name: Free Game Bot

on:
  push:
    branches:
      - main
    paths-ignore:
      - data/processed.json
  workflow_dispatch:
    inputs:
      claim_dry_run:
        description: "僅檢查支援的平台頁面，不執行領取"
        required: false
        default: false
        type: boolean
      claim_test_platform:
        description: "手動 Claim Dry Run 平台，例如 GOG / Epic Games / Steam"
        required: false
        default: ""
        type: string
      claim_test_url:
        description: "手動 Claim Dry Run 的商品網址"
        required: false
        default: ""
        type: string
      claim_test_name:
        description: "手動 Claim Dry Run 的遊戲名稱"
        required: false
        default: "Manual Claim Test"
        type: string
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: free-game-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Restore Epic Games login state
        run: |
          if [ -z "$EPIC_STORAGE_STATE_B64" ]; then
            echo "EPIC_STORAGE_STATE_B64 not configured, skip Epic Games login state"
            exit 0
          fi
          mkdir -p auth
          echo "$EPIC_STORAGE_STATE_B64" | base64 --decode > auth/epic.json
        env:
          EPIC_STORAGE_STATE_B64: ${{ secrets.EPIC_STORAGE_STATE_B64 }}
      - name: Restore GOG login state
        run: |
          if [ -z "$GOG_STORAGE_STATE_B64" ]; then
            echo "GOG_STORAGE_STATE_B64 not configured, skip GOG login state"
            exit 0
          fi
          mkdir -p auth
          echo "$GOG_STORAGE_STATE_B64" | base64 --decode > auth/gog.json
        env:
          GOG_STORAGE_STATE_B64: ${{ secrets.GOG_STORAGE_STATE_B64 }}
      - name: Restore Steam login state
        run: |
          if [ -z "$STEAM_STORAGE_STATE_B64" ]; then
            echo "STEAM_STORAGE_STATE_B64 not configured, skip Steam Games login state"
            exit 0
          fi
          mkdir -p auth
          echo "$STEAM_STORAGE_STATE_B64" | base64 --decode > auth/steam.json
        env:
          STEAM_STORAGE_STATE_B64: ${{ secrets.STEAM_STORAGE_STATE_B64 }}
      - name: Run manual claim dry-run test
        if: ${{ inputs.claim_test_platform != '' && inputs.claim_test_url != '' }}
        run: npm run claim:dry-run -- "${{ inputs.claim_test_platform }}" "${{ inputs.claim_test_url }}" "${{ inputs.claim_test_name }}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_CLAIM: "false"
          CLAIM_DRY_RUN: "true"
      - run: npm start
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_CLAIM: "false"
          CLAIM_DRY_RUN: ${{ inputs.claim_dry_run || false }}
      - name: Commit processed state
        run: |
          if git diff --quiet -- data/processed.json; then
            echo "No processed state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed.json
          git commit -m "chore: update processed state"
          git push
